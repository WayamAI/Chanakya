[project]
name = "chanakya"
version = "0.1.0"
description = "Chanakya: AI GTM prospecting agent for Wayam"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "python-dotenv>=1.0", "pydantic>=2.6", "mcp>=1.9", "keyring>=24", "openpyxl>=3.1", "anthropic>=2.8"]

[project.optional-dependencies]
dev = ["pytest>=8"]
dns = ["dnspython>=2.6"]  # optional; MX lookups fall back to nslookup

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
markers = ["live: calls the real Ollama API (opt-in with -m live)"]
addopts = "-m 'not live'"
